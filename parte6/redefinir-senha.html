<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Redefinir Senha</title>
    <link rel="stylesheet" href="css/redefinir-senha.css">
</head>
<body>
    <div class="caixa">
        <h2>Nova Senha</h2>
        <p id="infoEmail"></p>

        <form id="redefinir">
            <div class="form-group">
                <label>Nova senha</label>
                <input type="password" id="novaSenha" required minlength="4">
            </div>
            <div class="form-group">
                <label>Confirmar senha</label>
                <input type="password" id="confirmarSenha" required>
            </div>
            <button type="submit">Atualizar senha</button>
        </form>
        <div id="mensagem"></div>
    </div>
    <script>
        const urlParams = new URLSearchParams(window.location.search);
        const emailUsuario=urlParams.get('email');

        if (emailUsuario){
            document.getElementById('infoEmail').innerText= `Redefinindo para: ${emailUsuario}`;
        }else{
            alert("Email não identificado na URL!");
        }

        const form = document.getElementById('redefinir');
        const mensagem = document.getElementById('mensagem');

        form.addEventListener('submit', async (e) => {
            e.preventDefault();

            const novaSenha = document.getElementById('novaSenha').value;
            const confirmarSenha = document.getElementById('confirmarSenha').value;

            if(novaSenha !== confirmarSenha){
                mensagem.innerHTML = '<span style="color:red;">As senhas não coincidem!</span>';
                return;
            }

            try {
                const response = await fetch('http://localhost:8080/usuarios/redefinir-senha', {
                    method:'POST',
                    headers: {'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        email:emailUsuario,
                        novaSenha: novaSenha
                    })
                });

                if(response.ok){
                    mensagem.innerHTML='<span style="color: green;">Senha alterada com sucesso! Redirecionando...</span>';
                    setTimeout(() => {
                        window.location.href='login.html';
                    }, 2000);
                } else {
                    throw new Error ();
                }
            } catch(err) {
                mensagem.innerHTML= '<span style="color:black;">Erro ao atualizar senha.</span>';
            }
        });
    </script>
</body>
</html>
