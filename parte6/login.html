<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login</title>
    <link rel="stylesheet" href="css/login.css">
</head>
<body>

    <div class = superbox>
        <form id="login">
            <div class="TUDO">
                <h2>Login</h2>
                <div class="primeiro">
                    <label>Email:</label>
                    <input type="text" id="email" name="email" placeholder="Digite seu e-mail...">
                </div>
                <div class="segundo">
                    <label>Senha:</label>
                    <input type="password" id="senha" name="senha" placeholder="Digite sua senha...">
                </div>

                <br><br>
                <div class="btn">
                    <button type="submit">Entrar</button>
                </div>
                <div class="esqueci">
                    <a href="#" class="forgot-link" onclick="abrirModal()">Esqueci minha senha</a>
                </div>
                <div class="cadastre">
                <a href = "http://127.0.0.1:5500/index.html">Ainda não possui cadastro? Crie um aqui!</a>
                </div>
                <div id="errorMsg" class="error"></div>
            </div>
        </form>
        

        <div id="modalRecuperacao">
            <div class="modal-content">
                <h3>Recuperar Senha</h3>
                <p style="font-size: 15px; margin: 10px 0; margin-left: 20px; color:#c9c7c7; font-style: italic;">Enviaremos um link para o seu e-mail.</p>
                <div class="input-group">
                    <input type="email" id="emailRecuperar" placeholder="Seu e-mail cadastrado" style="width: 450px;">
                </div>
                <button onclick="enviarEmailRecuperacao()" class="carambolas">Enviar Link</button>
                <button onclick="fecharModal()" class="carambolas" style="background: #ccc; color: #333; margin-top: 5px;">Cancelar</button>
                <div id="statusRecuperacao" style="margin-top: 10px; font-size: 13px;"></div>
            </div>
        </div>
    </div>

<script>
    // Lógica de Login (Já existente, mantida)
    document.getElementById("loginForm").addEventListener("submit", function(event) {
        event.preventDefault();
        const email = document.getElementById("email").value;
        const senha = document.getElementById("senha").value;
        const errorMsg = document.getElementById("errorMsg");
        errorMsg.textContent = "";

        fetch("http://localhost:8080/usuarios/login", {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({ email, senha })
        })
        .then(response => {
            if (!response.ok) throw new Error("Email ou senha inválidos");
            return response.json();
        })
        .then(usuario => {
            localStorage.setItem("usuarioLogado", JSON.stringify(usuario));
            alert("Bem-vindo " + usuario.nome);
            window.location.href = "usuarios2.html";
        })
        .catch(error => { errorMsg.textContent = error.message; });
    });

    // --- ACERTOS: LÓGICA DE RECUPERAÇÃO ---

    function abrirModal() {
        document.getElementById("modalRecuperacao").style.display = "flex";
    }

    function fecharModal() {
        document.getElementById("modalRecuperacao").style.display = "none";
        document.getElementById("statusRecuperacao").textContent = "";
    }

    function enviarEmailRecuperacao() {
        const email = document.getElementById("emailRecuperar").value;
        const status = document.getElementById("statusRecuperacao");

        if (!email) {
            status.style.color = "red";
            status.textContent = "Digite um e-mail válido.";
            return;
        }

        status.style.color = "blue";
        status.textContent = "Processando...";

        alert();
        // Chama o endpoint de solicitação que envia o e-mail no Java
        fetch(`http://localhost:8080/usuarios/solicitar-recuperacao?email=${email}`, {
            method: "POST"
        })
        .then(response => {
            if (response.ok) {
                status.style.color = "green";
                status.textContent = "E-mail enviado! Verifique sua caixa.";
            } else {
                status.style.color = "red";
                status.textContent = "E-mail não encontrado.";
            }
        })
        .catch(() => {
            status.style.color = "red";
            status.textContent = "Erro ao conectar com o servidor.";
        });
    }
</script>

</body>
</html>
